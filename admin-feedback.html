<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0f1f" />
    <title>КИСФИТ — Обратная связь</title>
    <link rel="icon" href="./assets/kisfit-logo-wordmark-dark.png" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/kisfit-logo-wordmark-dark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .admin-wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 0 64px;
      }
      .admin-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
      }
      .admin-toolbar__grow {
        flex: 1 1 120px;
      }
      .admin-login {
        max-width: 420px;
      }
      .feedback-card {
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(10, 15, 31, 0.55);
        border-radius: 16px;
        padding: 16px 16px;
        margin-bottom: 12px;
      }
      .feedback-head {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .feedback-meta {
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
      }
      .feedback-body {
        display: grid;
        gap: 10px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        line-height: 1.55;
      }
      .feedback-pre {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
      }
      .feedback-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg__grid"></div>
      <div class="bg__glow bg__glow--a"></div>
      <div class="bg__glow bg__glow--b"></div>
      <div class="bg__glow bg__glow--c"></div>
      <div class="bg__noise"></div>
    </div>

    <header class="header">
      <a class="brand" href="./index.html#top" aria-label="КИСФИТ">
        <img class="brand__logo" src="./assets/kisfit-logo-wordmark-dark.png" alt="КИСФИТ" width="140" height="40" />
      </a>
      <nav class="nav" aria-label="Навигация">
        <a class="nav__link" href="./kisfit-panel.html">Заявки</a>
        <a class="nav__link" href="./beta.html">Форма заявки</a>
      </nav>
      <div class="header__actions">
        <a class="btn btn--ghost" href="./index.html">На главную</a>
      </div>
    </header>

    <main class="container admin-wrap">
      <div class="section__head" style="margin-bottom: 24px">
        <h1 class="h2" style="font-size: clamp(24px, 3.5vw, 34px); margin: 0; letter-spacing: -0.02em">
          Обратная связь
        </h1>
      </div>

      <section id="admin-login" class="form-card admin-login">
        <div class="form__field">
          <label class="form__label" for="admin-token">Токен доступа</label>
          <input class="form__input" id="admin-token" type="password" autocomplete="current-password" />
        </div>
        <div class="form__actions">
          <button type="button" class="btn btn--primary" id="admin-login-btn">
            <span class="btn__shine" aria-hidden="true"></span>
            Показать
          </button>
        </div>
        <div id="admin-login-error" class="form__error" style="display: none; margin-top: 12px" role="alert"></div>
      </section>

      <section id="admin-panel" hidden>
        <div class="admin-toolbar">
          <button type="button" class="btn btn--primary" id="admin-refresh">
            <span class="btn__shine" aria-hidden="true"></span>
            Обновить
          </button>
          <span class="admin-toolbar__grow"></span>
          <button type="button" class="btn btn--ghost" id="admin-logout">Выйти</button>
        </div>
        <p id="admin-status" class="muted" style="margin: 0 0 14px; min-height: 1.25em"></p>
        <div id="feedback-list"></div>
      </section>
    </main>

    <script src="./admin-feedback.js"></script>
  </body>
</html>
